# Local services for development: PostgreSQL 16 and Mailpit (SMTP sink with a web UI).
#   docker compose up -d
#   Mailpit UI: http://localhost:8025  (set EMAIL_TRANSPORT=smtp, SMTP_URL=smtp://localhost:1025)
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: academy
      POSTGRES_PASSWORD: academy_dev_password
      POSTGRES_DB: academy_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/docker/init-databases.sql:/docker-entrypoint-initdb.d/init-databases.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U academy -d academy_dev"]
      interval: 5s
      timeout: 3s
      retries: 10
  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "1025:1025"
      - "8025:8025"
volumes:
  postgres-data:
